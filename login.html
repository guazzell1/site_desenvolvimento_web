<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Centz</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="signup-container" style="display: flex; min-height: 100vh;">
        
        <section class="form-section" style="flex: 1; padding: 40px;">
            <div class="logo"><strong>Centz</strong></div>
            <h2>Bem-vindo de volta</h2>
            <p>Por favor, insira seus dados para acessar sua conta.</p>

            <form id="form-login">
                <div class="input-group">
                    <label for="login-email">Endereço de email</label>
                    <input type="email" id="login-email" placeholder="name@company.com" required>
                </div>
                
                <div class="input-group">
                    <label for="login-senha" style="display: flex; justify-content: space-between;">
                        Senha
                        <a href="#" style="color: #00d09c; text-decoration: none; font-size: 0.75rem;">Esqueceu a senha?</a>
                    </label>
                    <input type="password" id="login-senha" placeholder="••••••••" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="manter-logado">
                    <label for="manter-logado">Mantenha-me conectado</label>
                </div>

                <button type="submit" id="btn-entrar" class="btn-primary">Entrar na conta</button>
                
                <div class="divider">Ou continue com</div>
                
                <button type="button" id="btn-google-login" class="btn-google">Google</button>
            </form>
            
            <p style="margin-top: 24px;">Novo no Centz? <a href="cadastro.html" style="color: #00d09c; font-weight: 600;">Crie uma conta</a></p>
        </section>

        <section class="feature-section" style="flex: 1; background-color: #f1f5f9; padding: 40px;">
            <h3>Insights Financeiros Inteligentes</h3>
            <p style="color: #64748b; margin-top: 16px;">Domine seu dinheiro com rastreamento em tempo real.</p>
        </section>

    </div>

    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
