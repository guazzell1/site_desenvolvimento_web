<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Centz</title>
    <link rel="stylesheet" href="main.css">
    
</head>
<body>
    <div class="signup-container" style="display: flex; min-height: 100vh;">
        
        <section class="form-section" style="flex: 1; padding: 40px;">
            <div class="logo"><strong>Centz</strong></div>
            <h2>Crie sua conta</h2>
            <p>Junte-se a Centz e comece a dominar suas finanças hoje mesmo.</p>

            <form id="form-cadastro">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Enter your full name" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Endereço de email</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Min. 8 characters" minlength="8" required>
                </div>
                
                <div class="input-group">
                    <label for="confirma-senha">Confirme sua senha</label>
                    <input type="password" id="confirma-senha" placeholder="Repeat your password" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Concordo com os Termos de Serviço e a Política de Privacidade.</label>
                </div>

                <button type="submit" id="btn-cadastrar" class="btn-primary">Criar conta</button>
                
                <div class="divider">Ou entre com</div>
                
                <button type="button" id="btn-google" class="btn-google">Google</button>
            </form>
            
            <p>Ja tem uma conta? <a href="login.html">Entrar</a></p>
        </section>

        <section class="feature-section" style="flex: 1; background-color: #d1fae5; padding: 40px;">
            <h3>Controle suas finanças com facilidade.</h3>
        </section>

    </div>

    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="auth.js"></script>
</body>
</html>
