<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">

    <title>Document</title>
</head>

<body>
    <div id="app-view">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>CENTZ</h1>
                <p>Financial Clarity</p>
            </div>
            <nav class="sidebar-nav">
                <button>Dashboard</button>
                <button>Transações</button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-nova-transacao">+ Nova Transação</button>
            </div>
        </aside>
        <main id="main-content">
            <header id="header">
                <div class="header-left">
                    <input type="text" placeholder="Buscar transações...">
                </div>
                <div class="header-right">
                    <div class="avatar">U</div>
                </div>
            </header>
            <div class="page-content">
                <h2>Visão Geral</h2>
                <p>Aqui está o resumo financeiro</p>
                <div class="cards-container">
                    <div class="card">
                        <p>Saldo Atual</p>
                        <h2 id="display-saldo">R$ 0,00</h2>
                    </div>
                    <div class="card">
                        <p>Entradas do Mês</p>
                        <h3 id="card-income">R$ 0,00</h3>
                    </div>
                    <div class="card">
                        <p>Saídas do Mês</p>
                        <h3 id="card-expense">R$0,00</h3>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova Transação</h2>
                <button id="btn-close-modal" class="btn-close">X</button>
            </div>
            <form id="transaction-form">
                
                <div class="type-toggle">
                    <input type="radio" id="type-expense" name="transaction-type" value="despesa" checked>
                    <label for="type-expense" class="toggle-btn expense">Despesa</label>

                    <input type="radio" id="type-income" name="transaction-type" value="receita">
                    <label for="type-income" class="toggle-btn income">Receita</label>
                </div>

                <div class="input-group">
                    <label for="description">DESCRIÇÃO</label>
                    <input type="text" id="description" required>
                </div>

                <div class="input-group">
                    <label for="amount">VALOR</label>
                    <input type="number" id="amount" step="0.01" required>
                </div>

                <div class="input-group">
                    <label for="date">DATA</label>
                    <input type="date" id="date" required>
                </div>

                <div class="input-group">
                    <label for="category">CATEGORIA</label>
                    <select id="category">
                        <option value="Moradia">Moradia</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Salário">Salário</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="recurring">
                    <label for="recurring">Transação recorrente <span class="text-muted">(mensal)</span></label>
                </div>

                <button type="submit" id="btn-salvar">Salvar Transação</button>
            </form>
        </div>
    </div>
    
    <script src="forms.js"></script>
</body>

</html>
