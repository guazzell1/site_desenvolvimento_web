<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">

    <title>Document</title>
</head>

<body>
    <div id="app-view">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>CENTZ</h1>
                <p>Financial Clarity</p>
            </div>
            <nav class="sidebar-nav">
                <button>Dashboard</button>
                <button>Transações</button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-nova-transacao">+ Nova Transação</button>
            </div>
        </aside>
        <main id="main-content">
            <header id="header">
                <div class="header-left">
                    <input type="text" placeholder="Buscar transações...">
                </div>
                <div class="header-right">
                    <div class="avatar">U</div>
                </div>
            </header>
            <div class="page-content">
                <h2>Visão Geral</h2>
                <p>Aqui está o resumo financeiro</p>
                <div class="cards-container">
                    <div class="card">
                        <p>Saldo Atual</p>
                        <h2 id="display-saldo">R$ 0,00</h2>
                    </div>
                    <div class="card">
                        <p>Entradas do Mês</p>
                        <h3 id="card-income">R$ 0,00</h3>
                    </div>
                    <div class="card">
                        <p>Saídas do Mês</p>
                        <h3 id="card-expense">R$0,00</h3>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="forms.js"></script>
</body>

</html>
