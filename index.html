<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">

    <title>Document</title>
</head>

<body>
    <div id="app-view">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>CENTZ</h1>
                <p>Financial Clarity</p>
            </div>
        </aside>
        <main id="main-content">
            <header id="header">
                <div class="header-left">
                    <input type="text" placeholder="Buscar transações...">
                </div>
                <div class="header-right">
                    <div class="avatar">U</div>
                </div>
            </header>
            <h1>Centz</h1>
            <h2 id="display-saldo">R$0,00</h2>
            <form action="">
                <label for="">Descrição</label>
                <input type="text" id="input-descricao">
                <input type="number" id="input-valor">
                <input type="date" id="input-data">
                <select name="" id="input-tipo">
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
                <button type="submit" id="btn-salvar">Salvar</button>

            </form>
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Tipo</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="lista-transacoes"></tbody>
            </table>

            <div id="modal-overlay" class="modal-overlay">
                <div class="modal">
                    <div id="form">
                        <h2>Nova Transação</h2>
                        <form id="transaction-form">
                            <div class="input-group">
                                <label for="description">Descrição</label>
                                <input type="text" id="description" name="description"
                                    placeholder="Ex: Aluguel, Salário..." />
                            </div>

                            <div class="input-group">
                                <label for="amount">Valor</label>
                                <input type="number" step="0.01" id="amount" name="amount" placeholder="0,00" />
                            </div>

                            <div class="input-group">
                                <label for="date">Data</label>
                                <input type="date" id="date" name="date" />
                            </div>

                            <div class="input-group">
                                <label for="type">Tipo</label>
                                <select id="type" name="type">
                                    <option value="receita">Receita</option>
                                    <option value="despesa">Despesa</option>
                                </select>
                            </div>

                            <div class="modal-actions">
                                <button type="button" id="cancel-button" class="button cancel">Cancelar</button>
                                <button type="submit" id="save-button" class="button save">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="forms.js"></script>
</body>

</html>
